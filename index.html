<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кладовая">
<meta name="theme-color" content="#FAF3E8">
<title>Кладовая</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2B2B;--muted:#6A5646;--soft:#8A7A69;--line:#E3D6C4;--line2:#F1E8DC;--bg:#FAF3E8;--card:#FFFFFF;--acc:#D9703F;--yel:#F6E3B0;--yelb:#E3C67E;--green:#4E9A64;--amber:#E8A93A;--red:#D2553F;--shadow:0 1px 6px rgba(80,55,25,.06);--shadow2:0 2px 12px rgba(80,55,25,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(#F1E4D2 1.2px,transparent 1.2px);background-size:20px 20px;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:14px}
.scroll>*{flex-shrink:0}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sub{margin:0;font-size:13px;font-weight:800;color:var(--muted)}
h1{margin:2px 0 0;font-family:Lora,Georgia,serif;font-size:30px;font-weight:700;line-height:1.15}
h2{margin:0;font-family:Lora,Georgia,serif;font-size:21px;font-weight:700;line-height:1.2}
h3{margin:0;font-size:15px;font-weight:800}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn.acc{border:none;background:var(--acc);color:#fff;box-shadow:0 2px 6px rgba(217,112,63,.35)}
.cloud{font-size:11px;font-weight:800;color:var(--soft);min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px}
.cloud.ok{color:var(--green)}.cloud.err{color:var(--red)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow2)}
.seg button{flex:1;min-width:0;min-height:40px;border:none;border-radius:11px;background:transparent;font-size:12.5px;font-weight:600;padding:0 2px}
.seg button.on{background:var(--yel);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card.big{border-radius:22px;padding:14px;box-shadow:var(--shadow2)}
.pill{align-self:flex-start;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#4F4237;flex:none}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}.soft{color:var(--soft)}
.small{font-size:12px;font-weight:700}
.p{margin:0;font-size:13px;font-weight:600;line-height:1.45;color:#4F4237}
.addbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;justify-items:center;align-items:start}
.tile{position:relative;width:72px;padding:6px 2px 5px;border-radius:14px;border:1.5px solid #E6DACA;background:#fff;box-shadow:0 1px 4px rgba(80,55,25,.10);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.tile.sel{border-color:var(--acc);background:#FFF4EC;box-shadow:0 0 0 2px rgba(217,112,63,.35)}
.tile.dim{opacity:.3}
.tile .nm{width:100%;min-height:26px;padding:0 3px;font-size:11px;font-weight:700;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:normal;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.pkb{position:absolute;top:4px;left:4px;padding:1px 5px;border-radius:6px;background:var(--yel);font-size:10px;font-weight:800;line-height:1.3}
.tdot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(60,40,20,.12)}
.st-fresh{background:var(--green)}.st-soon{background:var(--amber)}.st-urgent{background:var(--red)}.st-unknown{background:#fff;border-color:#A89B8C}.st-no{background:#fff;border-color:#B5562A}
.more{width:72px;min-height:96px;border-radius:14px;border:1.5px dashed #D9CBB8;background:var(--bg);font-size:13px;font-weight:800;color:var(--muted)}
.alert{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;text-align:left;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow2)}
.alert.on{background:#FDF3DC;border-color:#E8C887}
.badge{width:40px;height:40px;flex:none;border-radius:12px;background:#C9536A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 4px;font-size:12px;font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:7px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;flex-shrink:0}
.scroll .hscroll{margin:0 -16px;padding:2px 16px 6px}
.chip{flex:none;min-height:40px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--yel);border-color:var(--yelb);font-weight:800}
.chip.dash{border-style:dashed;background:#FFF8F2;border-color:#E3C2A6}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:800;padding:0 14px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--ink)}
.btn.acc{border:none;background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(217,112,63,.35)}
.btn.green{background:#EEF5E8;border-color:#B9D6A8}
.btn.peach{background:#FCEBDD;border-color:#F0CDAF}
.btn.ghost{border-style:dashed;background:transparent;color:var(--muted);font-size:13px;min-height:38px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.in{width:100%;min-height:48px;border-radius:14px;border:1px solid #D9CBB8;background:#fff;padding:0 14px;font-size:16px;font-weight:700}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:800}
.stepper button.plus{background:var(--yel);border-color:var(--yelb)}
.stepper span{flex:1;text-align:center;font-size:15px;font-weight:800}
.lv{display:flex;gap:6px}.lv button{flex:1;min-height:44px;border-radius:12px;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);padding:0 4px}
.lv button.on{background:var(--yel);border-color:var(--yelb)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--bg);border-radius:14px;padding:8px 12px}
.kv p{margin:0}.kv .k{font-size:12px;font-weight:700;color:var(--muted)}.kv .v{font-size:15px;font-weight:800;margin-top:2px}
.idea{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border-radius:12px;border:1px solid #D3E4C6;background:#EEF5E8;color:#2F4A22;font-size:14px;font-weight:700;text-align:left;width:100%}
.backdrop{position:fixed;inset:0;background:rgba(60,45,30,.35);border:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#FFFDF8;box-shadow:0 -8px 30px rgba(60,40,20,.18);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;z-index:21}
.sheet>*{flex-shrink:0}
.grip{width:40px;height:5px;border-radius:3px;background:#DCCFBD;align-self:center}
.nav{flex:none;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{min-width:62px;min-height:50px;border:none;background:transparent;color:#5E5249;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:0}
.nav button span{padding:3px 12px;display:flex;border-radius:999px}
.nav button.on{color:var(--ink);font-weight:800}.nav button.on span{background:var(--yel)}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:528px;margin:0 auto;padding:12px 14px;border-radius:14px;background:#2F4A22;color:#fff;font-size:14px;font-weight:700;line-height:1.4;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.plate{flex:none;border-radius:50%;box-shadow:0 0 0 4px #F6EFE4,0 3px 10px rgba(80,55,25,.15)}
.hint{border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid}
.htag{align-self:flex-start;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.7);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#5A4632}
.irow{display:flex;align-items:center;gap:6px;min-height:48px;border-top:1px solid var(--line2);padding-top:6px}
.irow .sw{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(60,40,20,.15)}
.irow .g{width:50px;height:40px;border-radius:10px;border:1px solid #D9CBB8;background:var(--bg);text-align:center;font-size:15px;font-weight:800;padding:0}
.irow .pm{width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:800;padding:0}
.irow .pm.plus{background:var(--yel);border-color:var(--yelb)}
.irow .x{width:30px;height:40px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.step{display:flex;gap:10px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.dev{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:#FCEBDD;border:1px solid #F0CDAF;font-size:12px;font-weight:800;color:#7A3E1A}
.tip{margin:0;padding:8px 10px;border-radius:12px;background:#EEF5E8;font-size:12px;font-weight:700;line-height:1.45;color:#2F4A22}
.rcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;align-self:flex-start}
.check{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-top:1px solid var(--line2)}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--green)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:0}
.days button.on{background:var(--yel);border-color:var(--yelb)}
.days button.today{border-color:var(--acc)}
.bars{position:relative;height:120px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.bars>div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.empty{padding:16px;border-radius:18px;border:1.5px dashed #D9CBB8;background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:10px}
pre.share{margin:0;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-family:inherit;font-size:13px;font-weight:600;line-height:1.5;white-space:pre-wrap;max-height:300px;overflow-y:auto;-webkit-user-select:text;user-select:text}
details summary{cursor:pointer;font-size:14px;font-weight:800;color:var(--muted);list-style:none;min-height:40px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{min-height:44px}
</style>
